<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>KI ULTIME — Portail esport</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#050507; --bg2:#09090D; --card:#0D0D14; --card2:#12121A;
    --violet-dark:#241044; --violet:#6D28D9; --violet-light:#8B5CF6; --violet-neon:#A855F7;
    --text:#FFFFFF; --text-dim:#9CA3AF; --border:rgba(139,92,246,0.15);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;}
  button,input,select,textarea{font-family:inherit;}
  #app{width:100%;height:100vh;overflow:hidden;}
  .flex{display:flex;} .flex-1{flex:1;} .col{flex-direction:column;}
  .hidden{display:none;}
  a{color:inherit;text-decoration:none;}

  /* ---- layout shell ---- */
  .shell{display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  .sidebar-head{padding:20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
  .logo-img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(168,85,247,.55));}
  .brand-name{font-size:14px;font-weight:600;letter-spacing:.02em;}
  .brand-sub{font-size:10px;color:var(--text-dim);}
  .nav{flex:1;overflow-y:auto;padding:16px 12px;}
  .nav-section-title{font-size:10px;font-weight:600;letter-spacing:.12em;color:#5B5B68;padding:0 10px;margin-bottom:6px;}
  .nav-group{margin-bottom:20px;}
  .nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--text-dim);
    background:transparent;border:none;border-left:2px solid transparent;cursor:pointer;margin-bottom:2px;text-align:left;transition:all .15s;}
  .nav-item.active{background:rgba(139,92,246,.14);color:var(--violet-light);border-left:2px solid var(--violet-neon);}
  .nav-item:hover:not(.active){color:var(--text);}

  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);}
  .search{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}
  kbd{background:var(--card2);border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-size:10px;margin-left:6px;}
  .topbar-right{display:flex;align-items:center;gap:16px;}
  select.role-select{font-size:12px;background:var(--card2);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:6px 10px;}
  .avatar{border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:600;background:linear-gradient(135deg,var(--violet),var(--violet-neon));}
  .content{flex:1;overflow-y:auto;padding:24px;}

  /* ---- generic ---- */
  .card{background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 4px 24px rgba(0,0,0,.35);transition:all .25s;}
  .card.hoverable:hover{transform:translateY(-2px);border-color:rgba(139,92,246,.45);}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;background:rgba(139,92,246,.12);color:var(--violet-light);border:1px solid var(--border);}
  .badge.green{background:rgba(34,197,94,.12);color:#4ADE80;border-color:rgba(34,197,94,.25);}
  .badge.red{background:rgba(239,68,68,.12);color:#F87171;border-color:rgba(239,68,68,.25);}
  .badge.gray{background:rgba(156,163,175,.1);color:var(--text-dim);border-color:rgba(156,163,175,.2);}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-weight:500;font-size:13px;padding:8px 14px;border:none;cursor:pointer;transition:all .12s;}
  .btn:active{transform:scale(.96);}
  .btn.primary{background:linear-gradient(135deg,var(--violet),var(--violet-neon));color:#fff;}
  .btn.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
  .btn.sm{padding:6px 10px;font-size:12px;}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .section-title h2{font-size:14px;font-weight:600;margin:0;}
  h1.page-title{font-size:20px;font-weight:600;margin:0 0 4px;}
  .muted{color:var(--text-dim);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:10px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);}
  td{padding:10px 16px;border-top:1px solid var(--border);}
  input[type=text],select.field,textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;outline:none;}
  textarea{resize:none;background:var(--bg);}
  .grid{display:grid;gap:16px;}
  .g5{grid-template-columns:repeat(5,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-track{flex:1;height:8px;border-radius:4px;background:var(--card2);overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--violet-neon));border-radius:4px;}
  .dot{width:9px;height:9px;border-radius:999px;display:inline-block;}

  /* ---- auth screens ---- */
  .auth-wrap{width:100%;height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 20%, var(--violet-dark) 0%, var(--bg) 60%);}
  .auth-card{width:380px;padding:28px;text-align:center;}
  .discord-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#5865F2;color:#fff;
    border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px;}
  .discord-btn:active{transform:scale(.97);}

  /* ---- drawer / modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;}
  .drawer{margin-left:auto;width:420px;height:100%;background:var(--bg2);border-left:1px solid var(--border);padding:24px;overflow-y:auto;}
  .modal{margin:auto;width:560px;max-height:85vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;}
  .close-x{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;}

  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .btn.danger-armed{background:linear-gradient(135deg,#EF4444,#F87171);color:#fff;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}
  .ai-fab{position:fixed;bottom:22px;right:22px;width:52px;height:52px;border-radius:999px;background:linear-gradient(135deg,var(--violet),var(--violet-neon));
    display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 6px 20px rgba(139,92,246,.5);z-index:60;border:none;}
  .ai-panel{position:fixed;bottom:86px;right:22px;width:340px;height:440px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;
    display:flex;flex-direction:column;z-index:60;box-shadow:0 10px 40px rgba(0,0,0,.6);overflow:hidden;}
  .ai-head{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .ai-msgs{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
  .ai-msg{max-width:85%;padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.4;}
  .ai-msg.bot{background:var(--card2);border:1px solid var(--border);align-self:flex-start;}
  .ai-msg.user{background:linear-gradient(135deg,var(--violet),var(--violet-neon));color:#fff;align-self:flex-end;}
  .ai-input-row{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border);}
  .ai-input-row input{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;outline:none;}
</style>
</head>

function render(){ document.getElementById("app").innerHTML = renderRoot() + renderAIWidget(); }

function resetBtn(id,label){
  const armed = resetArmed[id];
  return `<button class="btn ${armed?'danger-armed':'ghost'} sm" onclick="handleReset('${id}')" style="${armed?'animation:pulse 1s infinite;':''}">${armed?'⚠️ Cliquer à nouveau pour confirmer':('↺ '+label)}</button>`;
}
function handleReset(id){
  if(resetArmed[id]){
    doReset(id);
    resetArmed[id]=false;
    render();
    return;
  }
  Object.keys(resetArmed).forEach(k=>resetArmed[k]=false);
  resetArmed[id]=true;
  render();
  setTimeout(()=>{ if(resetArmed[id]){ resetArmed[id]=false; render(); } },5000);
}
function doReset(id){
  if(id==='profile'){ state.myProfile={maps:[],agent:"",riotName:"",tracker:""}; state.profileSaved=false; }
  if(id==='strategy'){ const k=stratKey(); stratAttachments[k]={images:[],videos:[]}; stratNotes[k]=""; }
  if(id==='planning'){ SCHEDULE = DEFAULT_SCHEDULE.map(e=>({...e})); }
  if(id==='matches'){ matches = DEFAULT_MATCHES.map(e=>({...e})); }
  if(id==='logs'){ logs = []; }
  if(id.startsWith('note_')){ const pid=Number(id.split('_')[1]); playerNotes[pid]=""; }
  if(id.startsWith('roster_')){ const rid=Number(id.split('_')[1]); rosters = rosters.filter(r=>r.id!==rid); }
}

    <div class="shell">
      ${renderSidebar()}

        ${renderTopbar()}

function parseRiotIdFromTracker(url){
  try{
    const m = url.match(/riot\/([^\/]+)\//);
    if(!m) return null;
    return decodeURIComponent(m[1]);
  }catch(e){ return null; }
}
function renderTrackerPreview(url){
  if(!url || !url.trim()) return "";
  const riotId = parseRiotIdFromTracker(url.trim());
  if(!riotId){
    return `<div class="muted" style="font-size:12px;margin:-10px 0 18px;">Lien non reconnu — vérifie qu'il s'agit bien d'une URL tracker.gg/valorant/profile/riot/...</div>`;

  // Démo : on reconnaît le Riot ID de Nico pour illustrer la synchronisation.
  const known = PLAYERS.find(pl => pl.riotIdDemo === riotId);
  return `
    <div class="card" style="padding:14px;margin:-6px 0 18px;background:var(--card2);">
      <div style="font-size:12px;font-weight:600;margin-bottom:8px;">🔗 Riot ID détecté : <span style="color:var(--violet-light)">${riotId}</span></div>

      </div>
      <div class="muted" style="font-size:11px;margin-top:8px;">Statistiques synchronisées (démo) depuis le tracker de ${known.tag}.</div>
      ` : `<div class="muted" style="font-size:11px;">Aucune statistique en cache pour ce profil pour le moment (démo).</div>`}
      <div class="muted" style="font-size:10px;margin-top:8px;">⚠️ En démo uniquement : une vraie synchronisation automatique nécessite un serveur backend qui interroge l'API Tracker.gg, un navigateur ne peut pas l'appeler directement (CORS).</div>

let saveTimer=null;
function onNoteChange(){

let stratAttachments = {};
function stratKey(){ return state.activeMap+"_"+state.activeCat; }
function ensureAtt(){
  const k = stratKey();
  if(!stratAttachments[k]) stratAttachments[k] = {images:[], videos:[]};
  return stratAttachments[k];
}
function handleImageFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    ensureAtt().images.push(e.target.result);
    render();
  };
  reader.readAsDataURL(file);
  input.value = "";
}
function addVideoLink(){
  const url = prompt("Colle le lien de la vidéo (YouTube, Streamable, etc.) :");
  if(url && url.trim()){
    ensureAtt().videos.push(url.trim());
    render();
  }
}
function removeAttachment(type,index){
  const att = ensureAtt();
  att[type].splice(index,1);

}

const DEV_WHITELIST = ["yue_tv"];
function requestDiscordLogin(){
  const tag = document.getElementById("discordTag").value.trim();
  if(!tag) return;
  const id = Date.now();
  const isDev = DEV_WHITELIST.includes(tag.toLowerCase());
  if(isDev){
    if(!users.find(u=>u.pseudo.toLowerCase()===tag.toLowerCase())){
      users.push({id,pseudo:tag,email:tag+"@kiultime.gg",role:"DEV",game:"—",status:"Actif",last:"À l'instant"});
    }
    state.role = "DEV";
    state.authStatus = "app";
    render();
    return;
  }
  if(passwords.hasOwnProperty(tag.toLowerCase())){
    state.loginTag = tag;
    state.loginError = "";
    state.authStatus = "password";
    render();
    return;
  }
  requests.push({id,discordTag:tag,requestedAt:"à l'instant",status:"pending"});
  state.myRequestId = id;
  state.authStatus = "pending";
  render();
}
function checkPassword(){
  const pwd = document.getElementById("loginPassword").value;
  const expected = passwords[state.loginTag.toLowerCase()];
  if(pwd && pwd === expected){
    const u = users.find(x=>x.pseudo.toLowerCase()===state.loginTag.toLowerCase());
    state.role = u ? u.role : "JOUEUR";
    state.loginError = "";
    state.authStatus = "app";
    render();
  } else {
    state.loginError = "Mot de passe incorrect.";
    render();
  }
}
function enterApp(){ state.role="JOUEUR"; state.authStatus="app"; render(); }
function toggleFavMap(name){
  const p = state.myProfile;
  if(p.maps.includes(name)){
    p.maps = p.maps.filter(m=>m!==name);
  } else if(p.maps.length<3){
    p.maps.push(name);
  }
  state.profileSaved=false;
  render();
}
function updateProfileField(k,v){ state.myProfile[k]=v; state.profileSaved=false; }
function saveProfile(){ state.profileSaved=true; render(); }
function logout(){ state.authStatus="login"; state.myRequestId=null; state.loginTag=""; state.loginError=""; render(); }
function setRole(r){ state.role=r; render(); }
function setPage(p){ state.page=p; state.activeMap=null; render(); }
function openPlayer(id){ state.selectedPlayer=id; state.playerNoteDraftSaved=false; render(); }
function closePlayer(e){ if(e&&e.target!==e.currentTarget) return; state.selectedPlayer=null; render(); }
function canEditNotes(){ return ["STAFF","ADMIN","FONDATEUR","DEV"].includes(state.role); }
function savePlayerNote(id){
  const val = document.getElementById("noteText").value;
  playerNotes[id] = val;
  state.playerNoteDraftSaved = true;
  render();
}
function openMap(id){ state.activeMap=id; state.activeCat="Attaque"; render(); }
function closeMap(){ state.activeMap=null; render(); }
function setCat(c){ state.activeCat=c; render(); }
function setMatchFilter(f){ state.matchFilter=f; render(); }
function openAddMatch(){ state.showAddMatch=true; state.addMatchStep=1; state.addMatchForm={opponent:"",map:MAPS[0].name,type:"Officiel",scoreA:"",scoreB:""}; state.addMatchSelected=[]; state.addMatchStats={}; render(); }
function closeAddMatch(e){ if(e&&e.target!==e.currentTarget) return; state.showAddMatch=false; render(); }
function saveMatch(){
  const f = state.addMatchForm;
  const result = Number(f.scoreA||0) > Number(f.scoreB||0) ? "V" : "D";
  const playerStats = state.addMatchSelected.map(pid=>{
    const p = PLAYERS.find(x=>x.id===pid);
    const s = state.addMatchStats[pid] || {};
    return {id:pid, tag:p.tag, agent:s.agent||p.agent, kills:s.kills||0, deaths:s.deaths||0, assists:s.assists||0};
  });
  matches.unshift({id:Date.now(),opponent:f.opponent||"Nouvel adversaire",date:"Aujourd'hui",map:f.map,score:`${f.scoreA||0}-${f.scoreB||0}`,result,type:f.type,playerStats});
  state.showAddMatch=false; render();
}
function generatePassword(){
  return Math.random().toString(36).slice(-4).toUpperCase() + Math.random().toString(36).slice(-4).toUpperCase();
}
function decideRequest(id,decision){
  const req = requests.find(r=>r.id===id);
  req.status = decision;
  if(decision==="approved"){
    const pwd = generatePassword();
    passwords[req.discordTag.toLowerCase()] = pwd;
    req.generatedPassword = pwd;
    users.push({id:Date.now(),pseudo:req.discordTag,email:"—",role:"JOUEUR",game:"VALORANT",status:"Actif",last:"À l'instant"});
  }
  render();
}
function updateUserRole(id,role){
  const u = users.find(x=>x.id===id);
  u.role = role;
  render();
}
/* ============================= AI ASSISTANT (démo, données locales) ============================= */
function renderAIWidget(){
  if(state.authStatus!=="app") return "";
  if(!state.aiOpen){
    return `<button class="ai-fab" onclick="toggleAI()">🤖</button>`;
  }
  return `
    <div class="ai-panel">
      <div class="ai-head">
        <span>🤖 Assistant KI ULTIME</span>
        <button class="close-x" onclick="toggleAI()">✕</button>
      </div>
      <div class="ai-msgs" id="aiMsgs">
        ${state.aiMessages.map(m=>`<div class="ai-msg ${m.role==='bot'?'bot':'user'}">${m.text}</div>`).join("")}
      </div>
      <div class="ai-input-row">
        <input type="text" id="aiInput" placeholder="Pose ta question…" onkeydown="if(event.key==='Enter')sendAIMessage()">
        <button class="btn primary sm" onclick="sendAIMessage()">➤</button>
      </div>
    </div>`;
}
function toggleAI(){ state.aiOpen=!state.aiOpen; render(); if(state.aiOpen){ const el=document.getElementById('aiMsgs'); if(el) el.scrollTop=el.scrollHeight; } }
function sendAIMessage(){
  const input = document.getElementById("aiInput");
  const q = input.value.trim();
  if(!q) return;
  state.aiMessages.push({role:"user", text:q});
  state.aiMessages.push({role:"bot", text:computeAIAnswer(q)});
  render();
  setTimeout(()=>{
    const el=document.getElementById('aiMsgs');
    if(el) el.scrollTop = el.scrollHeight;
    const inp=document.getElementById('aiInput');
    if(inp) inp.focus();
  },0);
}
function computeAIAnswer(qRaw){
  const q = qRaw.toLowerCase();
  // joueur
  const player = PLAYERS.find(p => q.includes(p.tag.toLowerCase().replace("ki | ","")) || q.includes(p.name.toLowerCase().split(" ")[0]));
  if(player){
    return `${player.tag} joue ${player.role} (agent principal : ${player.agent}). K/D ${player.kd}, ACS ${player.acs}, HS% ${player.hs}, Winrate ${player.winrate}%. Statut : ${STATUS_LABEL[player.status]}.`;
  }
  // prochain match
  if(q.includes("prochain match") || (q.includes("prochain") && q.includes("match"))){
    const next = SCHEDULE.find(e=>e.type==="MATCH");
    if(next) return `Le prochain match est ${next.day} (${next.time}) : ${next.title}.`;
    return "Aucun match n'est planifié pour le moment.";
  }
  // planning / prac
  if(q.includes("planning") || q.includes("prac") && !q.includes("map")){
    const evs = SCHEDULE.slice(0,3).map(e=>`${e.day} : ${e.title} (${e.time})`).join(" — ");
    return `Voici les prochains événements : ${evs}.`;
  }
  // map
  const map = MAPS.find(m => q.includes(m.name.toLowerCase()));
  if(map){
    return `Sur ${map.name}, l'équipe a un winrate de ${map.winrate}% (${map.wins}V - ${map.losses}D sur ${map.played} matchs), avec ${map.strats} stratégies enregistrées.`;
  }
  // winrate général
  if(q.includes("winrate") || q.includes("stats équipe") || q.includes("stats de l'équipe")){
    const wins = matches.filter(m=>m.result==="V").length;
    return `L'équipe a un winrate de ${Math.round((wins/matches.length)*100)}% sur les ${matches.length} derniers matchs enregistrés.`;
  }
  if(q.includes("bonjour") || q.includes("salut") || q.includes("hello")){
    return "Salut ! Demande-moi les stats d'un joueur, le prochain match, ou le winrate d'une map.";
  }
  return "Je n'ai pas encore cette information — pose-moi une question sur un joueur (ex. \"stats de Nico\"), une map (ex. \"winrate sur Ascent\"), ou le prochain match.";
}

render();
</script>
